name: Regenerate Visual Baselines

# Visual regression baselines are pixel-exact to the machine that rendered them.
# Generating them on a laptop and committing them means CI compares macOS (or an
# arbitrary container's) font rasterisation against ubuntu-latest's — which is
# exactly why e2e/visual.spec.ts used to be skipped in CI entirely.
#
# This workflow regenerates them ON the CI runner image, so the committed
# baseline is the one CI will actually compare against. Run it:
#   - when a visual test has no baseline yet (a newly-enabled screenshot test)
#   - after an intentional UI change that should move the baseline
#   - if e2e-visual goes red purely on antialiasing after a runner image bump
#
# It never runs automatically: a baseline that updates itself is the "blind
# snapshot update" anti-pattern, where a real regression is absorbed into the
# expected output. A human asks for it, and reviews the resulting diff.
on:
  workflow_dispatch:
    inputs:
      commit_baselines:
        description: 'Commit the regenerated baselines to a branch (otherwise upload as an artifact only)'
        type: boolean
        default: false

env:
  NODE_VERSION: '24'

jobs:
  regenerate:
    name: Regenerate baselines on the CI image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Run through the same real Worker and serial Chromium contract as CI.
      # --update-snapshots writes a baseline for every @visual test: missing ones
      # are created, existing ones are overwritten with what this runner renders.
      - name: Regenerate @visual baselines
        run: npm run test:e2e:full-stack -- --project=chromium --grep @visual --workers=1 --update-snapshots
        env:
          CI: 'true'

      - name: Show what changed
        run: git status --porcelain e2e/visual.spec.ts-snapshots/

      # Default path: hand the baselines back as an artifact so a human can look
      # at them before anything lands.
      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-chromium-linux
          path: app/e2e/visual.spec.ts-snapshots/
          retention-days: 14

      # Opt-in path: push to a branch so the diff can be opened as a PR and
      # reviewed image-by-image. Never pushes to main.
      - name: Commit baselines to a branch
        if: ${{ inputs.commit_baselines }}
        run: |
          if [ -z "$(git status --porcelain e2e/visual.spec.ts-snapshots/)" ]; then
            echo "Baselines already match this runner — nothing to commit."
            exit 0
          fi
          BRANCH="chore/visual-baselines-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add e2e/visual.spec.ts-snapshots/
          git commit -m "chore: regenerate visual baselines on ubuntu-latest

          Generated by .github/workflows/visual-baselines.yml (run ${GITHUB_RUN_ID})
          so the committed baselines match what CI renders. Review the image diff
          before merging — this is the point at which a real visual regression
          would otherwise be absorbed into the expected output."
          git push origin "$BRANCH"
          echo "Pushed $BRANCH — open a PR and review the image diff."
