name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            app/test/integration/package-lock.json

      - name: Install app dependencies
        run: npm ci

      # validate:unrun-tests asks the integration runner what it collects.
      # That runner has an independent lockfile and loads the Workers pool from
      # its Vitest config, so the inventory is not available after installing
      # only app/package-lock.json.
      - name: Install integration test dependencies
        run: npm ci
        working-directory: ./app/test/integration

      - name: Run ESLint
        run: npm run lint

      # Catches the always-green patterns from the July 2026 audit: assertions
      # nullified by .catch(), runtime self-skips, tautologies, and tests with
      # no assertion at all. Gating — every one of these shipped here as a
      # passing test that could not fail, so a warning would not be enough.
      - name: Check for always-green test patterns
        run: npm run validate:test-antipatterns

      # Reports tests that name a module they never import, tests that
      # reimplement the logic they claim to cover, and modules imported only by
      # their own tests. Advisory while a backlog existed; the backlog is zero,
      # and a clean checker left on continue-on-error silently refills.
      - name: Check test/subject linkage
        run: npm run validate:test-links

      # The linkage check above asks whether anything imports a *module*; this
      # asks the same of each exported symbol, which is the granularity two bugs
      # in this repo hid at — slicer.ts had one live export and four dead ones
      # carrying a units bug, and instrument-types.ts had one dead export
      # answering "is this melodic?" wrongly for 24 of 99 catalogue ids. Both
      # had passing tests, which is what kept them alive. Also advisory until
      # the backlog cleared; now at zero dead runtime exports, so it blocks.
      - name: Check for unreachable exports
        run: npm run validate:dead-exports

      # The two checks above ask whether production reaches the code a test
      # covers. This asks the mirror question: does any lane reach the test?
      # Six staging files — 103 tests, 226 assertions — are collected by
      # nothing, which is how an always-green try/catch survived in
      # failure-modes.test.ts for months. They are declared in the script's
      # allowlist; a seventh, or an allowlist entry that a lane now runs,
      # fails here. Its first run found e2e/last-cell-flicker.spec.ts: a spec
      # whose only test had been removed, leaving a docblock Playwright
      # collected nothing from.
      - name: Check every test file is run by a lane
        run: npm run validate:unrun-tests

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install integration test dependencies
        run: npm ci
        working-directory: ./app/test/integration

      - name: Run integration tests
        run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Type-check and dry-run the Worker bundle
        run: npm run check:worker

  instrument-validation:
    name: Instrument Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install real audio toolchain
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Playwright browsers for sample decode
        run: npx playwright install --with-deps chromium webkit

      - name: Verify Pipeline v2 real encode/decode contract
        run: npx vitest run test/sample-pipeline-real-contract.test.ts
        env:
          RUN_REAL_SAMPLE_PIPELINE: '1'

      - name: Run all validators
        run: npm run validate:all

      - name: Verify browser sample decode
        run: npx playwright test e2e/sample-browser-decode.spec.ts --project=chromium --retries=0
        env:
          USE_MOCK_API: '1'
          CI: 'true'

  # E2E is split into three jobs by what each one needs, replacing a single
  # `continue-on-error: true` job whose comment read "E2E tests are advisory -
  # many require real backend". Exempting all 36 spec files because some of them
  # need a backend meant no E2E failure could ever break the build, and the
  # backend-dependent specs still never ran anywhere in CI.
  #
  #   e2e-tests          mock API, gating     — the everyday regression net
  #   e2e-real-backend   wrangler dev, gating — the complete production path
  #   e2e-visual         screenshots, gating  — runner-owned Linux baselines
  #
  # See docs/TEST-AUDIT-2026-07.md for the audit and lane ownership rationale.
  e2e-tests:
    name: E2E Tests (mock API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate E2E backend inventories
        run: npm run validate:e2e-inventories

      # The reviewed mock-compatible manifest is the strict release subset:
      # zero retries and no skipped/flaky/unexpected results are accepted.
      - name: Run required mock-compatible E2E tests (Chromium)
        shell: bash
        run: |
          required_specs=()
          while IFS= read -r spec; do required_specs+=("$spec"); done < e2e/mock-compatible-files.txt
          test "${#required_specs[@]}" -eq 5
          discovered=$(npx playwright test "${required_specs[@]}" --project=chromium --list | sed -n 's/^Total: \([0-9][0-9]*\) tests.*/\1/p')
          test "$discovered" = "65"
          npx playwright test "${required_specs[@]}" --project=chromium --retries=0
          node - <<'NODE'
          const fs = require('node:fs');
          const { stats } = JSON.parse(fs.readFileSync('test-results/blocking-results.json', 'utf8'));
          const expected = { expected: 65, skipped: 0, flaky: 0, unexpected: 0 };
          const actual = Object.fromEntries(Object.keys(expected).map(key => [key, stats[key] ?? 0]));
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Blocking Playwright contract failed: ${JSON.stringify({ expected, actual })}`);
          }
          NODE
        env:
          USE_MOCK_API: '1'
          CI: 'true'
          PLAYWRIGHT_OUTPUT_DIR: 'test-results/blocking-artifacts'
          PLAYWRIGHT_JSON_OUTPUT_FILE: 'test-results/blocking-results.json'
          PLAYWRIGHT_HTML_REPORT: 'playwright-report-blocking'

      # PR #65 moved real collaboration coverage to the Worker-backed contract
      # below. Every remaining offline Chromium spec is therefore blocking too.
      - name: Run remaining offline E2E tests (Chromium)
        id: offline
        shell: bash
        run: |
          offline_specs=()
          while IFS= read -r spec; do offline_specs+=("$spec"); done < <(
            comm -23 \
              <(find e2e -type f -name '*.spec.ts' ! -path 'e2e/staging/*' | sort) \
              <(sort e2e/mock-compatible-files.txt)
          )
          # The two real-audio matrix specs are CPU-bound. Serial execution
          # avoids timeout inflation while keeping every test first-attempt-only.
          #
          # visual.spec.ts is excluded via E2E_FUNCTIONAL_ONLY below. It used to
          # skip everywhere, so it cost this lane nothing; it now runs, and four
          # of its tests have no committed baseline at all — they were wrapped
          # in `if (await stepCell.isVisible())` guards that were always false
          # on an empty session, so they never executed and never produced one.
          # A baseline must be generated on this runner image (see
          # .github/workflows/visual-baselines.yml) rather than from a
          # contributor's machine, and until it is, these belong in the macOS
          # visual job below and not in a gating lane. populated-visual.spec.ts
          # is the deterministic visual coverage that does gate.
          #
          # This previously also passed --grep-invert @visual, a second
          # mechanism aimed at the same file. Both collect exactly 151 tests
          # here, so the tag filter is redundant with the path filter pre-push
          # already uses; one mechanism is easier to reason about than two that
          # happen to agree.
          npx playwright test "${offline_specs[@]}" --project=chromium --workers=1 --retries=0
          node - <<'NODE'
          const fs = require('node:fs');
          const { stats } = JSON.parse(fs.readFileSync('test-results/offline-results.json', 'utf8'));
          const expected = { expected: 83, skipped: 69, flaky: 0, unexpected: 0 };
          const actual = Object.fromEntries(Object.keys(expected).map(key => [key, stats[key] ?? 0]));
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Offline Playwright contract failed: ${JSON.stringify({ expected, actual })}`);
          }
          NODE
        env:
          USE_MOCK_API: '1'
          E2E_FUNCTIONAL_ONLY: '1'
          CI: 'true'
          PLAYWRIGHT_OUTPUT_DIR: 'test-results/offline-artifacts'
          PLAYWRIGHT_JSON_OUTPUT_FILE: 'test-results/offline-results.json'
          PLAYWRIGHT_HTML_REPORT: 'playwright-report-offline'

      - name: Summarize Playwright results
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const readStats = path => fs.existsSync(path)
            ? JSON.parse(fs.readFileSync(path, 'utf8')).stats
            : null;
          const blocking = readStats('test-results/blocking-results.json');
          const offline = readStats('test-results/offline-results.json');
          const rows = (label, stats) => stats ? [
            `#### ${label}`,
            `- Passed: ${stats.expected}`,
            `- Failed: ${stats.unexpected}`,
            `- Flaky: ${stats.flaky}`,
            `- Skipped: ${stats.skipped}`,
          ] : [`#### ${label}`, '- Not run'];
          const summary = [
            '### Playwright E2E result',
            '',
            ...rows('Blocking (zero retries)', blocking),
            '',
            ...rows('Remaining offline (zero retries)', offline),
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      # The offline run above cannot exercise the WebSocket-connected path:
      # waitForCollaborationReady is a no-op when USE_MOCK_API=1, because that
      # backend has no WebSocket server. This step runs the session contract
      # and every spec containing a useMockAPI skip against a real Worker, in
      # one wrangler session. The inventory check above prevents a new guarded
      # spec from silently remaining in the mock-only lane.
      - name: Run collaboration contract against real Worker
        shell: bash
        run: |
          npm run test:e2e:collaboration:worker
          node - <<'NODE'
          const fs = require('node:fs');
          const { stats } = JSON.parse(fs.readFileSync('test-results/worker-results.json', 'utf8'));
          const expected = { expected: 73, skipped: 0, flaky: 0, unexpected: 0 };
          const actual = Object.fromEntries(Object.keys(expected).map(key => [key, stats[key] ?? 0]));
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Worker Playwright contract failed: ${JSON.stringify({ expected, actual })}`);
          }
          NODE
        env:
          CI: 'true'
          PLAYWRIGHT_OUTPUT_DIR: 'test-results/worker-artifacts'
          PLAYWRIGHT_JSON_OUTPUT_FILE: 'test-results/worker-results.json'
          PLAYWRIGHT_HTML_REPORT: 'playwright-report-worker'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report-blocking/
            app/playwright-report-offline/
            app/playwright-report-worker/
            app/test-results/
          retention-days: 7

  visual-tests-macos:
    name: Visual Tests (macOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run deterministic Holby visual tests
        shell: bash
        run: |
          npx playwright test e2e/populated-visual.spec.ts --project=chromium --retries=0
          node - <<'NODE'
          const fs = require('node:fs');
          const { stats } = JSON.parse(fs.readFileSync('test-results/visual-results.json', 'utf8'));
          const expected = { expected: 3, skipped: 0, flaky: 0, unexpected: 0 };
          const actual = Object.fromEntries(Object.keys(expected).map(key => [key, stats[key] ?? 0]));
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Visual Playwright contract failed: ${JSON.stringify({ expected, actual })}`);
          }
          NODE
        env:
          USE_MOCK_API: '1'
          CI: 'true'
          PLAYWRIGHT_OUTPUT_DIR: 'test-results/visual-artifacts'
          PLAYWRIGHT_JSON_OUTPUT_FILE: 'test-results/visual-results.json'
          PLAYWRIGHT_HTML_REPORT: 'playwright-report-visual'

      - name: Upload visual diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-visual-report-macos
          path: |
            app/playwright-report-visual/
            app/test-results/
          retention-days: 7

  e2e-real-backend:
    name: E2E Tests (real backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 13 spec files still carry `test.skip(useMockAPI, ...)` — the multiplayer,
      # session-persistence, race-condition and publish flows. Under USE_MOCK_API
      # every one of them skips, so they run in no other CI job.
      #
      # This complements the `test:e2e:collaboration:worker` step in e2e-tests:
      # that runs the collaboration contract subset against a real Worker; this
      # runs the complete functional Chromium suite against the same production
      # path. The first audit runs proved Wrangler stable here, so failures gate.
      # --project=chromium matters: the script's default scope runs every
      # project, including the webkit-backed mobile profiles, and this job only
      # installs chromium. Without it the run dies on a missing webkit binary
      # rather than telling you anything about the backend.
      #
      # --workers=2 matters too: every worker shares one wrangler dev instance.
      # Running the default worker count against it produced a wave of
      # ECONNREFUSED partway through a local trial — the backend, not the tests,
      # was the bottleneck.
      # Screenshot contracts have a separate real-Worker lane below. Keeping
      # them out here prevents Linux pixel diffs from being reported as backend
      # failures, which previously hid ten failed tests behind continue-on-error.
      - name: Run functional E2E tests against wrangler dev
        shell: bash
        run: |
          npm run test:e2e:full-stack -- --project=chromium --workers=2
          node - <<'NODE'
          const fs = require('node:fs');
          const { stats } = JSON.parse(fs.readFileSync('test-results/real-backend-results.json', 'utf8'));
          const expected = { expected: 199, skipped: 17, flaky: 0, unexpected: 0 };
          const actual = Object.fromEntries(Object.keys(expected).map(key => [key, stats[key] ?? 0]));
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Real-backend Playwright contract failed: ${JSON.stringify({ expected, actual })}`);
          }
          NODE
        env:
          CI: 'true'
          E2E_FUNCTIONAL_ONLY: '1'
          PLAYWRIGHT_OUTPUT_DIR: 'test-results/real-backend-artifacts'
          PLAYWRIGHT_JSON_OUTPUT_FILE: 'test-results/real-backend-results.json'
          PLAYWRIGHT_HTML_REPORT: 'playwright-report-real-backend'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-real-backend
          path: |
            app/playwright-report-real-backend/
            app/test-results/real-backend-results.json
          retention-days: 7

  e2e-visual:
    name: E2E Visual Regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # visual.spec.ts used to skip in CI, then ran against Vite's mock backend
      # with developer-generated Linux baselines under continue-on-error. Nine
      # of eleven tests failed on every run while the check stayed green. The
      # baselines now come from this runner and the production-like Worker path;
      # every image and the exact result inventory gate.
      - name: Run visual regression tests
        shell: bash
        run: |
          npm run test:e2e:full-stack -- --project=chromium --grep @visual --workers=1
          node - <<'NODE'
          const fs = require('node:fs');
          const { stats } = JSON.parse(fs.readFileSync('test-results/visual-results.json', 'utf8'));
          const expected = { expected: 11, skipped: 0, flaky: 0, unexpected: 0 };
          const actual = Object.fromEntries(Object.keys(expected).map(key => [key, stats[key] ?? 0]));
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Visual Playwright contract failed: ${JSON.stringify({ expected, actual })}`);
          }
          NODE
        env:
          CI: 'true'
          PLAYWRIGHT_OUTPUT_DIR: 'test-results/visual-artifacts'
          PLAYWRIGHT_JSON_OUTPUT_FILE: 'test-results/visual-results.json'
          PLAYWRIGHT_HTML_REPORT: 'playwright-report-visual'

      - name: Upload visual diff report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-visual
          path: |
            app/playwright-report-visual/
            app/test-results/visual-results.json
          retention-days: 7
