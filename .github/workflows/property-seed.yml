name: Property Seed Diversity

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  randomized-properties:
    name: Properties with a rotating fast-check seed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FC_SEED: ${{ github.run_id }}
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the complete unit suite with this run's replayable seed
        run: npm run test:unit

      - name: Build application for Workers integration tests
        run: npm run build

      - name: Install integration test dependencies
        run: npm ci
        working-directory: ./app/test/integration

      - name: Run the multiplayer state model with this run's replayable seed
        run: npx vitest run state-machine-fuzz.test.ts
        working-directory: ./app/test/integration
